<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <title>Roles y Permisos | Áurea Salud - Sistema Mejorado</title>
  <!-- Página optimizada y corregida -->
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <link rel="icon" href="/recursos-graficos/Logo-sin-letras-removebg-preview.ico" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/source-sans-3@5.0.12/index.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
  <link rel="stylesheet" href="../assets/css/adminlte.css" />
  <link rel="stylesheet" href="../assets/css/animaciones-sistema.css" />

  <!-- DataTables CSS -->
  <link rel="stylesheet" href="https://cdn.datatables.net/v/bs5/dt-1.13.8/r-2.5.0/fc-4.3.0/b-2.4.2/b-html5-2.4.2/b-print-2.4.2/datatables.min.css" />

  <style>
    body { font-family: "Source Sans 3", system-ui, sans-serif; }
    .card { border-radius: 1rem; }
    .required::after { content:" *"; color:#dc3545; }
    .dt-buttons .btn { margin-right: .25rem; }
    .form-section-title { font-weight: 700; font-size: 1.05rem; border-left: 4px solid var(--bs-primary); padding-left: .5rem; margin: 1rem 0 .75rem; }

    /* Estilo de la “matriz tipo Excel” */
    table.matriz-permisos th, table.matriz-permisos td { white-space: nowrap; }
    table.matriz-permisos thead th { vertical-align: middle; text-align: center; }
    .col-rol { position: sticky; left: 0; background: var(--bs-body-bg); z-index: 3; }
    .col-desc { position: sticky; left: 220px; background: var(--bs-body-bg); z-index: 3; }
    .sticky-shadow { box-shadow: 4px 0 6px -4px rgba(0,0,0,.15); }
    .badge-role { font-size: .75rem; }
    .table-perm-check { display: flex; align-items: center; justify-content: center; }
    .toolbar-actions { display:flex; gap:.5rem; flex-wrap:wrap; }
    .category-chip { font-size:.8rem; border-radius: 1rem; padding:.2rem .6rem; background: var(--bs-light); border:1px solid var(--bs-border-color); }

    /* Modal roles */
    .perm-group { border:1px solid var(--bs-border-color); border-radius:.75rem; padding:.75rem; background: var(--bs-body-bg); }
    .perm-group h6 { margin:0 0 .5rem 0; display:flex; align-items:center; justify-content:space-between; }
    .perm-list { display:grid; grid-template-columns: repeat(auto-fill, minmax(220px,1fr)); gap:.35rem .75rem; }
  </style>
</head>
<body class="layout-fixed sidebar-expand-lg bg-body-tertiary">
  <div class="app-wrapper">

    <!-- Encabezado -->
    <nav class="app-header navbar navbar-expand bg-body shadow-sm">
      <div class="container-fluid">
        <a class="navbar-brand d-flex align-items-center gap-2" href="../../index.html">
          <img src="../../recursos-graficos/Logo-sin-letras--removebg-preview.png" alt="Áurea Salud" width="32" height="32" class="rounded-circle shadow-sm border border-light-subtle" />
          <span class="fw-semibold text-primary">Áurea Salud</span>
        </a>
      </div>
    </nav>

    <!-- Contenido principal -->
    <main class="app-main">
      <div class="app-content-header">
        <div class="container-fluid">
          <div class="row align-items-center">
            <div class="col-sm-6">
              <h3 class="mb-0"><i class="bi bi-shield-lock-fill me-2"></i>Roles y Permisos</h3>
            </div>
            <div class="col-sm-6">
              <ol class="breadcrumb float-sm-end mb-0">
                <li class="breadcrumb-item"><a href="../index.html">Inicio</a></li>
                <li class="breadcrumb-item active">Roles y Permisos</li>
              </ol>
            </div>
          </div>
        </div>
      </div>

      <div class="app-content py-3">
        <div class="container-fluid">

          <!-- Panel superior: Acciones -->
          <div class="card shadow-sm mb-4">
            <div class="card-body d-flex flex-wrap justify-content-between align-items-center">
              <div class="d-flex align-items-center gap-2">
                <i class="bi bi-grid-1x2"></i>
                <span class="fw-semibold">Matriz de Roles × Permisos</span>
              </div>
              <div class="toolbar-actions">
                <button class="btn btn-primary btn-sm" data-bs-toggle="modal" data-bs-target="#modalNuevoRol">
                  <i class="bi bi-plus-circle me-1"></i> Nuevo Rol
                </button>
                <button id="btnGuardarCambios" class="btn btn-success btn-sm">
                  <i class="bi bi-save me-1"></i> Guardar Cambios
                </button>
                <!-- Los botones de exportación se insertan desde DataTables -->
              </div>
            </div>
          </div>

          <!-- Matriz tipo Excel -->
          <div class="card shadow-sm">
            <div class="card-body">
              <div class="table-responsive">
                <table id="tablaPermisos" class="table table-striped table-hover w-100 align-middle matriz-permisos">
                  <thead id="theadPermisos"></thead>
                  <tbody id="tbodyPermisos"></tbody>
                </table>
              </div>
              <small class="text-secondary d-block mt-2">
                Consejo: puedes hacer scroll horizontal para ver todas las categorías de permisos. Usa la búsqueda para filtrar por rol o descripción.
              </small>
            </div>
          </div>

        </div>
      </div>
    </main>
  </div>

  <!-- Modal: Nuevo Rol -->
  <div class="modal fade" id="modalNuevoRol" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-lg modal-dialog-scrollable">
      <form id="formNuevoRol" class="modal-content" novalidate>
        <div class="modal-header">
          <h5 class="modal-title"><i class="bi bi-person-gear me-2"></i>Crear nuevo rol</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" ></button>
        </div>
        <div class="modal-body">
          <div class="row g-3">
            <div class="col-md-5">
              <label class="form-label required">Nombre del rol</label>
              <input type="text" class="form-control" name="nombre" required />
            </div>
            <div class="col-md-7">
              <label class="form-label">Descripción</label>
              <input type="text" class="form-control" name="descripcion" placeholder="¿Para quién es este rol?" />
            </div>
          </div>
          <div class="form-section-title mt-3">Permisos iniciales</div>
          <div id="permisosNuevoRol" class="d-grid gap-3"></div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancelar</button>
          <button type="submit" class="btn btn-primary"><i class="bi bi-check2-circle me-1"></i> Crear rol</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Modal: Ver/Editar Rol -->
  <div class="modal fade" id="modalEditarRol" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-xl modal-dialog-scrollable">
      <form id="formEditarRol" class="modal-content" novalidate>
        <div class="modal-header">
          <h5 class="modal-title"><i class="bi bi-sliders2-vertical me-2"></i>Editar rol</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" ></button>
        </div>
        <div class="modal-body">
          <div class="row g-3 mb-2">
            <div class="col-md-4">
              <label class="form-label required">Nombre del rol</label>
              <input type="text" class="form-control" name="nombre" required />
            </div>
            <div class="col-md-6">
              <label class="form-label">Descripción</label>
              <input type="text" class="form-control" name="descripcion" />
            </div>
            <div class="col-md-2">
              <label class="form-label">Usuarios</label>
              <input type="number" class="form-control" name="usuarios" min="0" step="1" />
            </div>
          </div>

          <div class="form-section-title">Permisos</div>
          <div id="gruposPermisosEditar" class="d-grid gap-3"></div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cerrar</button>
          <button type="submit" class="btn btn-success"><i class="bi bi-save me-1"></i> Guardar cambios</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Librerías -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  <!-- DataTables bundle (DT + Responsive + FixedColumns + Buttons + HTML5 export + Print) -->
  <script src="https://cdn.datatables.net/v/bs5/dt-1.13.8/r-2.5.0/fc-4.3.0/b-2.4.2/b-html5-2.4.2/b-print-2.4.2/datatables.min.js"></script>

  <script>
    /** =========================
     *  Definición de permisos
     *  ========================= */
    const PERMISOS = [
      {
        categoria: "Usuarios",
        claves: [
          {key:"usr.view", label:"Ver usuarios"},
          {key:"usr.create", label:"Crear usuarios"},
          {key:"usr.edit", label:"Editar usuarios"},
          {key:"usr.delete", label:"Eliminar usuarios"},
          {key:"usr.roles", label:"Asignar roles"}
        ]
      },
      {
        categoria: "Pacientes",
        claves: [
          {key:"pac.view", label:"Ver pacientes"},
          {key:"pac.create", label:"Crear pacientes"},
          {key:"pac.edit", label:"Editar pacientes"},
          {key:"pac.delete", label:"Eliminar pacientes"},
          {key:"pac.files", label:"Ver/Adjuntar archivos"}
        ]
      },
      {
        categoria: "Agenda",
        claves: [
          {key:"ag.view", label:"Ver agenda"},
          {key:"ag.manage", label:"Gestionar agenda"},
          {key:"ag.block", label:"Bloquear horarios"},
          {key:"ag.assign", label:"Asignar profesionales"}
        ]
      },
      {
        categoria: "Reportes",
        claves: [
          {key:"rep.view", label:"Ver reportes"},
          {key:"rep.export", label:"Exportar datos"},
          {key:"rep.finance", label:"Reportes financieros"}
        ]
      },
      {
        categoria: "Configuración",
        claves: [
          {key:"cfg.view", label:"Ver configuración"},
          {key:"cfg.edit", label:"Editar parámetros"},
          {key:"cfg.integrations", label:"Integraciones"}
        ]
      },
      {
        categoria: "Seguridad",
        claves: [
          {key:"sec.audit", label:"Ver bitácora"},
          {key:"sec.roles", label:"Gestionar roles"},
          {key:"sec.perms", label:"Gestionar permisos"},
          {key:"sec.2fa", label:"Forzar 2FA"}
        ]
      }
    ];

    /** =========================
     *  Datos de ejemplo (roles)
     *  ========================= */
    let ROLES = [
      {
        id: 1, nombre: "Administrador", descripcion: "Acceso total al sistema",
        usuarios: 3,
        permisos: Object.fromEntries(PERMISOS.flatMap(c => c.claves).map(p => [p.key, true]))
      },
      {
        id: 2, nombre: "Coordinador", descripcion: "Gestión operativa y agenda",
        usuarios: 8,
        permisos: {
          "usr.view": true, "usr.roles": true,
          "pac.view": true, "pac.create": true, "pac.edit": true, "pac.files": true,
          "ag.view": true, "ag.manage": true, "ag.block": true, "ag.assign": true,
          "rep.view": true, "rep.export": true,
          "cfg.view": true,
          "sec.audit": true
        }
      },
      {
        id: 3, nombre: "Profesional", descripcion: "Profesionales de salud",
        usuarios: 24,
        permisos: {
          "usr.view": false,
          "pac.view": true, "pac.create": true, "pac.edit": true, "pac.files": true,
          "ag.view": true, "ag.manage": true,
          "rep.view": true,
          "cfg.view": false
        }
      },
      {
        id: 4, nombre: "Recepción", descripcion: "Admisión y atención al público",
        usuarios: 6,
        permisos: {
          "usr.view": false,
          "pac.view": true, "pac.create": true, "pac.edit": true,
          "ag.view": true, "ag.manage": true, "ag.block": false,
          "rep.view": false, "rep.export": false,
          "cfg.view": false
        }
      }
    ];

    /** =========================
     *  Construcción de la tabla
     *  ========================= */
    let dt;
    const thead = document.getElementById('theadPermisos');
    const tbody = document.getElementById('tbodyPermisos');

    function construirCabecera(){
      // Fila 1: categorías
      const tr1 = document.createElement('tr');
      // Columnas fijas
      tr1.innerHTML = `
        <th class="col-rol sticky-shadow" style="min-width:220px">Rol</th>
        <th class="col-desc sticky-shadow" style="min-width:320px">Descripción</th>
        <th style="min-width:120px">Usuarios</th>
      `;
      // Dinámicas por categorías
      PERMISOS.forEach(cat=>{
        const th = document.createElement('th');
        th.colSpan = cat.claves.length;
        th.textContent = cat.categoria;
        tr1.appendChild(th);
      });

      // Fila 2: nombres de permisos
      const tr2 = document.createElement('tr');
      tr2.innerHTML = `
        <th class="col-rol sticky-shadow">Rol</th>
        <th class="col-desc sticky-shadow">Descripción</th>
        <th>Asignados</th>
      `;
      PERMISOS.forEach(cat=>{
        cat.claves.forEach(p=>{
          const th = document.createElement('th');
          th.title = p.key;
          th.innerHTML = `<span class="small">${p.label}</span>`;
          tr2.appendChild(th);
        });
      });

      thead.innerHTML = '';
      thead.appendChild(tr1);
      thead.appendChild(tr2);
    }

    function construirCuerpo(){
      tbody.innerHTML = '';
      ROLES.forEach(rol=>{
        const tr = document.createElement('tr');

        const tdRol = document.createElement('td');
        tdRol.className = 'col-rol sticky-shadow';
        tdRol.innerHTML = `
          <div class="d-flex align-items-center gap-2">
            <i class="bi bi-shield-lock"></i>
            <a href="#" class="fw-semibold text-decoration-none" onclick="abrirModalEditar(${rol.id}); return false;">${rol.nombre}</a>
            <span class="badge text-bg-secondary badge-role">${rol.id}</span>
          </div>`;
        tr.appendChild(tdRol);

        const tdDesc = document.createElement('td');
        tdDesc.className = 'col-desc sticky-shadow';
        tdDesc.textContent = rol.descripcion || '—';
        tr.appendChild(tdDesc);

        const tdUsers = document.createElement('td');
        tdUsers.innerHTML = `<span class="badge text-bg-info">${rol.usuarios ?? 0}</span>`;
        tr.appendChild(tdUsers);

        // Celdas de permisos
        PERMISOS.forEach(cat=>{
          cat.claves.forEach(p=>{
            const td = document.createElement('td');
            td.className = 'table-perm-check';
            const checked = !!rol.permisos?.[p.key];
            td.innerHTML = `
              <input type="checkbox"
                     aria-label="${p.label} para ${rol.nombre}"
                     data-role="${rol.id}"
                     data-perm="${p.key}"
                     ${checked ? 'checked' : ''} />
            `;
            tr.appendChild(td);
          });
        });

        tbody.appendChild(tr);
      });
    }

    function initDataTable(){
      if(dt){ dt.destroy(); }
      dt = new DataTable('#tablaPermisos', {
        responsive: true,
        scrollX: true,
        pageLength: 10,
        autoWidth: false,
        language: { url: 'https://cdn.datatables.net/plug-ins/1.13.8/i18n/es-CL.json' },
        dom: 'Bfrtip',
        buttons: [
          { extend:'excel', className:'btn btn-outline-success btn-sm', text:'<i class="bi bi-file-earmark-excel me-1"></i>Excel' },
          { extend:'csv',   className:'btn btn-outline-primary btn-sm', text:'<i class="bi bi-filetype-csv me-1"></i>CSV' },
          { extend:'pdf',   className:'btn btn-outline-danger btn-sm', text:'<i class="bi bi-filetype-pdf me-1"></i>PDF' },
          { extend:'print', className:'btn btn-outline-dark btn-sm', text:'<i class="bi bi-printer me-1"></i>Imprimir' }
        ],
        fixedColumns: { start: 2 } // Rol y Descripción fijos
      });
    }

    /** =========================
     *  Eventos de interacción
     *  ========================= */
    // Toggle checkboxes actualiza el modelo
    function delegarCheckboxes(){
      tbody.addEventListener('change', (e)=>{
        const target = e.target;
        if(target && target.matches('input[type="checkbox"][data-role]')){
          const rid = Number(target.dataset.role);
          const perm = target.dataset.perm;
          const rol = ROLES.find(r => r.id === rid);
          if(!rol.permisos) rol.permisos = {};
          rol.permisos[perm] = target.checked;
        }
      });
    }

    // Guardar cambios (en memoria)
    function wireGuardar(){
      document.getElementById('btnGuardarCambios').addEventListener('click', ()=>{
        // Aquí enviarías ROLES al backend con fetch/AJAX.
        const toast = document.createElement('div');
        toast.className = 'toast align-items-center text-bg-success border-0 position-fixed top-0 end-0 m-3';
        toast.role = 'alert';
        toast.innerHTML = `
          <div class="d-flex">
            <div class="toast-body">
              <i class="bi bi-check2-circle me-2"></i> Cambios guardados (memoria). Integra tu backend para persistir.
            </div>
            <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"></button>
          </div>`;
        document.body.appendChild(toast);
        new bootstrap.Toast(toast, { delay: 2500 }).show();
      });
    }

    /** =========================
     *  Modal Nuevo Rol
     *  ========================= */
    function renderPermisosNuevoRol(){
      const cont = document.getElementById('permisosNuevoRol');
      cont.innerHTML = '';
      PERMISOS.forEach(cat=>{
        const box = document.createElement('div');
        box.className = 'perm-group';
        const catId = 'new-' + cat.categoria.replace(/\s+/g,'-').toLowerCase();
        box.innerHTML = `
          <h6>
            <span>${cat.categoria}</span>
            <div class="form-check form-switch">
              <input class="form-check-input" type="checkbox" id="${catId}-all">
              <label class="form-check-label small" for="${catId}-all">Marcar todos</label>
            </div>
          </h6>
          <div class="perm-list">
            ${cat.claves.map(p => `
              <div class="form-check">
                <input class="form-check-input" type="checkbox" id="${catId}-${p.key}" data-perm="${p.key}">
                <label class="form-check-label" for="${catId}-${p.key}">${p.label}</label>
              </div>`).join('')}
          </div>`;
        cont.appendChild(box);

        // Toggle por categoría
        const toggleAll = box.querySelector(`#${catId}-all`);
        toggleAll.addEventListener('change', ()=>{
          box.querySelectorAll('input[type="checkbox"][data-perm]').forEach(ch => ch.checked = toggleAll.checked);
        });
      });
    }

    function wireNuevoRol(){
      const form = document.getElementById('formNuevoRol');
      form.addEventListener('submit', (e)=>{
        e.preventDefault();
        const nombre = form.nombre.value.trim();
        if(!nombre){ form.nombre.focus(); return; }
        const descripcion = form.descripcion.value.trim();
        const newId = (Math.max(0, ...ROLES.map(r=>r.id)) + 1);
        const permisos = {};
        document.querySelectorAll('#permisosNuevoRol input[type="checkbox"][data-perm]').forEach(ch=>{
          if(ch.checked) permisos[ch.dataset.perm] = true;
        });

        ROLES.push({ id: newId, nombre, descripcion, usuarios: 0, permisos });

        // Re-render tabla
        construirCuerpo();
        initDataTable(); // recrea DT para reflejar nuevas filas

        // Cerrar modal y limpiar
        bootstrap.Modal.getInstance(document.getElementById('modalNuevoRol')).hide();
        form.reset();
        renderPermisosNuevoRol();
      });

      // Al abrir, renderizar los permisos
      document.getElementById('modalNuevoRol').addEventListener('show.bs.modal', renderPermisosNuevoRol);
    }

    /** =========================
     *  Modal Editar Rol
     *  ========================= */
    let rolEditando = null;

    function abrirModalEditar(id){
      rolEditando = ROLES.find(r => r.id === id);
      if(!rolEditando) return;

      const form = document.getElementById('formEditarRol');
      form.nombre.value = rolEditando.nombre;
      form.descripcion.value = rolEditando.descripcion || '';
      form.usuarios.value = rolEditando.usuarios ?? 0;

      // Render grupos de permisos
      const cont = document.getElementById('gruposPermisosEditar');
      cont.innerHTML = '';
      PERMISOS.forEach(cat=>{
        const box = document.createElement('div');
        box.className = 'perm-group';
        const catId = 'edit-' + cat.categoria.replace(/\s+/g,'-').toLowerCase() + '-' + id;
        box.innerHTML = `
          <h6>
            <span>${cat.categoria}</span>
            <div class="d-flex align-items-center gap-2">
              <span class="category-chip">${cat.claves.length} permisos</span>
              <div class="form-check form-switch">
                <input class="form-check-input" type="checkbox" id="${catId}-all">
                <label class="form-check-label small" for="${catId}-all">Marcar todos</label>
              </div>
            </div>
          </h6>
          <div class="perm-list">
            ${cat.claves.map(p => {
              const checked = !!rolEditando.permisos?.[p.key];
              const cid = `${catId}-${p.key}`;
              return `
                <div class="form-check">
                  <input class="form-check-input" type="checkbox" id="${cid}" data-perm="${p.key}" ${checked?'checked':''}>
                  <label class="form-check-label" for="${cid}">${p.label}</label>
                </div>`;
            }).join('')}
          </div>`;
        cont.appendChild(box);

        // Toggle por categoría
        const toggleAll = box.querySelector(`#${catId}-all`);
        toggleAll.addEventListener('change', ()=>{
          box.querySelectorAll('input[type="checkbox"][data-perm]').forEach(ch => ch.checked = toggleAll.checked);
        });
      });

      new bootstrap.Modal('#modalEditarRol').show();
    }

    function wireEditarRol(){
      const form = document.getElementById('formEditarRol');
      form.addEventListener('submit', (e)=>{
        e.preventDefault();
        if(!rolEditando) return;

        // Datos básicos
        rolEditando.nombre = form.nombre.value.trim();
        rolEditando.descripcion = form.descripcion.value.trim();
        rolEditando.usuarios = Number(form.usuarios.value) || 0;

        // Permisos
        const nuevos = {};
        document.querySelectorAll('#gruposPermisosEditar input[type="checkbox"][data-perm]').forEach(ch=>{
          if(ch.checked) nuevos[ch.dataset.perm] = true;
        });
        rolEditando.permisos = nuevos;

        // Actualizar tabla
        construirCuerpo();
        initDataTable();

        // Cerrar modal
        bootstrap.Modal.getInstance(document.getElementById('modalEditarRol')).hide();

        // Feedback
        const toast = document.createElement('div');
        toast.className = 'toast align-items-center text-bg-success border-0 position-fixed top-0 end-0 m-3';
        toast.role = 'alert';
        toast.innerHTML = `
          <div class="d-flex">
            <div class="toast-body">
              <i class="bi bi-check2-circle me-2"></i> Rol actualizado correctamente.
            </div>
            <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"></button>
          </div>`;
        document.body.appendChild(toast);
        new bootstrap.Toast(toast, { delay: 2000 }).show();
      });
    }

    /** =========================
     *  Inicialización
     *  ========================= */
